name = "links-api"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true
preview_urls = false

# Generic short-link domain shared by all clients. Its DNS is on Cloudflare
# (registered with an Australian registrar); Cloudflare creates the record and certificate.
routes = [
  { pattern = "taggd.au", custom_domain = true }
]

[vars]
# Where short links point: SHORT_BASE/{code}. Old workers.dev /s/{code} links keep working.
SHORT_BASE = "https://taggd.au"

# Create with: npx wrangler d1 create links-db  — then paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "links-db"
database_id = "759e26da-7c22-4bc7-b09f-ab666a750a5d"

# Secret (not in this file): npx wrangler secret put ADMIN_TOKEN

version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /workers/contact-api
      - /workers/in-the-loop-api
      - /workers/links-api
      - /workers/proof-score-api
    schedule:
      interval: monthly
    # One PR per package across all four workers, instead of one per worker
    groups:
      workers:
        patterns: ["*"]
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
